id: macos.auto_lock
platform: macos
category: theft
severity: medium
relevance:
  default: recommended
  rules:
    - when: { portable: true }
      level: essential
    - when: { leaves_home: true }
      level: essential
    - when: { shared: true }
      level: essential
probe:
  builtin: macos.auto_lock_timeout
text:
  en:
    title: Automatic screen lock
    title_pass: The screen locks itself quickly when you walk away
    title_fail: Make the screen lock itself sooner
    why: >-
      If you forget to lock the Mac, it stays open until the screen turns off. The
      shorter that time, the smaller the window for someone to use it. If you take
      it outside or share it, aim for 5 minutes or less; at home, 15 minutes.
    fix_steps:
      - Open System Settings > Lock Screen.
      - Set "Turn display off on battery when inactive" and "Turn display off on power adapter when inactive" to 5 minutes (or 15 at home).
      - Optionally set "Start Screen Saver when inactive" to the same time or less.
      - Tip, lock it yourself when you leave it with Control-Command-Q.
    deep_link: x-apple.systempreferences:com.apple.Lock-Screen-Settings.extension
    fix_warning: >-
      The screen will turn off and the screen saver will start after 5 minutes without use, on battery and on the power adapter.
  es:
    title: Bloqueo automático de la pantalla
    title_pass: La pantalla se bloquea sola enseguida cuando te alejas
    title_fail: Haz que la pantalla se bloquee antes
    why: >-
      Si olvidas bloquear el Mac, sigue abierto hasta que se apaga la pantalla.
      Cuanto menos tiempo, menos margen tiene alguien para usarlo. Si lo sacas de
      casa o lo compartes, apunta a 5 minutos o menos; en casa, a 15.
    fix_steps:
      - Abre Ajustes del Sistema > Pantalla bloqueada.
      - Pon "Apagar la pantalla con batería si está inactiva" y "Apagar la pantalla con el adaptador de corriente si está inactiva" en 5 minutos (o 15 en casa).
      - Si quieres, pon "Iniciar el salvapantallas si está inactivo" en el mismo tiempo o menos.
      - Truco, bloquéalo tú al levantarte con Control + Comando + Q.
    deep_link: x-apple.systempreferences:com.apple.Lock-Screen-Settings.extension
    fix_warning: >-
      La pantalla se apagará y saltará el salvapantallas tras 5 minutos sin usarlo, con batería y con el cargador.
references:
  - https://support.apple.com/guide/mac-help/change-lock-screen-settings-mh11784/mac
credits: [mSCP]
fix:
  steps:
    - admin: true
      read: [/usr/bin/pmset, -g, custom]
      read_match: '(?s)AC Power:.*?displaysleep\s+(\d+)'
      apply: [/usr/bin/pmset, -c, displaysleep, "5"]
      undo: [/usr/bin/pmset, -c, displaysleep, "{previous}"]
    - admin: true
      read: [/usr/bin/pmset, -g, custom]
      read_match: '(?s)Battery Power:.*?displaysleep\s+(\d+)'
      apply: [/usr/bin/pmset, -b, displaysleep, "5"]
      undo: [/usr/bin/pmset, -b, displaysleep, "{previous}"]
    - read: [/usr/bin/defaults, -currentHost, read, com.apple.screensaver, idleTime]
      read_match: '^\s*(\d+)\s*$'
      apply: [/usr/bin/defaults, -currentHost, write, com.apple.screensaver, idleTime, -int, "300"]
      undo: [/usr/bin/defaults, -currentHost, write, com.apple.screensaver, idleTime, -int, "{previous}"]
      undo_if_missing: [/usr/bin/defaults, -currentHost, delete, com.apple.screensaver, idleTime]
