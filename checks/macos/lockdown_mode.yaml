id: macos.lockdown_mode
platform: macos
category: privacy
severity: medium
relevance:
  default: not_applicable
  rules:
    - when: { risk: elevated }
      level: recommended
probe:
  command: [sysctl, -n, security.mac.lockdown_mode_state]
  rules:
    - match: '^\s*1'
      exit: 0
      status: pass
    - match: '^\s*0'
      exit: 0
      status: fail
text:
  en:
    title_pass: Lockdown Mode is on
    title_fail: Consider turning on Lockdown Mode
    why: >-
      Lockdown Mode is an extreme protection for people who may be targeted by
      sophisticated spyware (journalists, activists, people in high-risk
      situations). It turns off some features to remove ways in. Only shown because
      your profile says your risk is elevated.
    fix_steps:
      - Open System Settings > Privacy & Security.
      - Scroll to Lockdown Mode, click "Turn On" and restart.
      - Turn it on on your iPhone and iPad too.
    deep_link: x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension
  es:
    title_pass: El modo de aislamiento está activado
    title_fail: Plantéate activar el modo de aislamiento
    why: >-
      El modo de aislamiento es una protección extrema para personas que pueden ser
      objetivo de software espía avanzado (periodistas, activistas, personas en
      situaciones de riesgo). Desactiva algunas funciones para cerrar vías de
      entrada. Solo aparece porque tu perfil indica un riesgo elevado.
    fix_steps:
      - Abre Ajustes del Sistema > Privacidad y seguridad.
      - Baja hasta Modo de aislamiento, pulsa "Activar" y reinicia.
      - Actívalo también en tu iPhone y tu iPad.
    deep_link: x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension
references:
  - https://support.apple.com/105120
credits: [drduh/macOS-Security-and-Privacy-Guide]
