id: macos.auto_updates
platform: macos
category: updates
severity: high
relevance:
  default: essential
probe:
  builtin: macos.auto_updates
text:
  en:
    title: Automatic macOS updates
    title_pass: macOS updates itself automatically
    title_fail: Turn on automatic macOS updates
    why: >-
      Most attacks use security holes that Apple has already fixed. Automatic
      updates install those fixes without you having to remember.
    fix_steps:
      - Open System Settings > General > Software Update.
      - Click the info button next to "Automatic updates".
      - Turn on "Check for updates", "Download new updates when available" and "Install macOS updates".
    deep_link: x-apple.systempreferences:com.apple.Software-Update-Settings.extension
    fix_warning: >-
      Your Mac will restart by itself to install macOS updates, usually overnight. Save your work before you leave it.
  es:
    title: Actualizaciones automáticas de macOS
    title_pass: macOS se actualiza solo
    title_fail: Activa las actualizaciones automáticas de macOS
    why: >-
      La mayoría de ataques aprovechan fallos de seguridad que Apple ya ha
      arreglado. Las actualizaciones automáticas instalan esos arreglos sin que
      tengas que acordarte.
    fix_steps:
      - Abre Ajustes del Sistema > General > Actualización de software.
      - Pulsa el botón de información junto a "Actualizaciones automáticas".
      - Activa "Buscar actualizaciones", "Descargar actualizaciones nuevas cuando estén disponibles" e "Instalar actualizaciones de macOS".
    deep_link: x-apple.systempreferences:com.apple.Software-Update-Settings.extension
    fix_warning: >-
      Tu Mac se reiniciará solo para instalar actualizaciones de macOS, normalmente de noche. Guarda tu trabajo antes de dejarlo.
references:
  - https://support.apple.com/guide/mac-help/keep-your-mac-up-to-date-mchlpx1065/mac
credits: [fort, mSCP]
fix:
  steps:
    - admin: true
      read: [/usr/bin/defaults, read, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticCheckEnabled]
      read_match: '^\s*(\S+)\s*$'
      previous_map: {"1": "true", "0": "false"}
      apply: [/usr/bin/defaults, write, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticCheckEnabled, -bool, "true"]
      undo: [/usr/bin/defaults, write, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticCheckEnabled, -bool, "{previous}"]
      undo_if_missing: [/usr/bin/defaults, delete, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticCheckEnabled]
    - admin: true
      read: [/usr/bin/defaults, read, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticDownload]
      read_match: '^\s*(\S+)\s*$'
      previous_map: {"1": "true", "0": "false"}
      apply: [/usr/bin/defaults, write, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticDownload, -bool, "true"]
      undo: [/usr/bin/defaults, write, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticDownload, -bool, "{previous}"]
      undo_if_missing: [/usr/bin/defaults, delete, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticDownload]
    - admin: true
      read: [/usr/bin/defaults, read, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticallyInstallMacOSUpdates]
      read_match: '^\s*(\S+)\s*$'
      previous_map: {"1": "true", "0": "false"}
      apply: [/usr/bin/defaults, write, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticallyInstallMacOSUpdates, -bool, "true"]
      undo: [/usr/bin/defaults, write, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticallyInstallMacOSUpdates, -bool, "{previous}"]
      undo_if_missing: [/usr/bin/defaults, delete, /Library/Preferences/com.apple.SoftwareUpdate, AutomaticallyInstallMacOSUpdates]
