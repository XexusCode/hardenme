name: Pages

# Builds the phone checklist web page from the check files and publishes it
# on GitHub Pages. One-time setup: in the repository, Settings > Pages >
# Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["checks/**", "internal/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the page
        run: go run . site --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
