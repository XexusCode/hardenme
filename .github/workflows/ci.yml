name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a vulnerability published after the last push is still caught.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: install.sh syntax
        run: sh -n install.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # GOOS=darwin: the code is built for macOS only, so analyse that build.
      - name: staticcheck
        run: GOOS=darwin go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: GOOS=darwin go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: shellcheck
        run: shellcheck install.sh
